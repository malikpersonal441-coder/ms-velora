<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MS Velora — Fine Jewellery for Women</title>
    <meta
      name="description"
      content="Discover necklaces, earrings, rings, bangles and bridal sets at MS Velora. Elegant jewellery for women, gift-boxed and delivered across Pakistan."
    />
    <meta property="og:title" content="MS Velora — Fine Jewellery for Women" />
    <meta
      property="og:description"
      content="Elegant jewellery for women — necklaces, earrings, rings and bridal sets."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Brand icons -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Preload the header logo so it appears instantly -->
    <link rel="preload" as="image" href="/brand/logo.jpg" type="image/jpeg" />
  </head>
  <body class="bg-[#FAF8F5] text-[#0D0D0D] antialiased selection:bg-[#C5A059]/25 selection:text-[#0D0D0D]">
    <!-- Opening loader: Round luxury gold medallion with rotating shimmer halo and breathing glow -->
    <div id="msv-loader" role="status" aria-live="polite" aria-label="Loading MS Velora">
      <div class="msv-loader-container">
        <div class="msv-halo-ring"></div>
        <div class="msv-logo-disc">
          <img class="msv-logo" src="/brand/logo.jpg" alt="MS Velora Fine Jewellery" width="160" height="160" />
        </div>
      </div>
      <div class="msv-caption">
        <span class="msv-brand-title">MS VELORA</span>
        <span class="msv-brand-sub">FINE JEWELLERY</span>
        <span class="msv-line" aria-hidden="true"></span>
      </div>
    </div>
    <style>
      #msv-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#08090B;transition:opacity .7s cubic-bezier(.4,0,.2,1),visibility .7s}
      .msv-loader-container{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
      .msv-halo-ring{position:absolute;inset:-6px;border-radius:50%;padding:2px;background:conic-gradient(from 0deg,transparent 0%,#C5A059 25%,#F4DFA8 50%,#C5A059 75%,transparent 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:msv-spin 3.2s linear infinite}
      .msv-logo-disc{width:140px;height:140px;border-radius:50%;overflow:hidden;padding:2px;background:linear-gradient(135deg,#DFBD78,#C5A059 50%,#9E7B36);box-shadow:0 0 35px rgba(197,160,89,.35),0 0 15px rgba(0,0,0,.8);position:relative;z-index:2;animation:msv-float 3s ease-in-out infinite alternate}
      .msv-logo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
      .msv-caption{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
      .msv-brand-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.28em;color:#DFBD78;text-transform:uppercase;animation:msv-fade 1.2s ease forwards}
      .msv-brand-sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:.32em;color:rgba(250,248,245,.65);text-transform:uppercase}
      .msv-line{display:block;height:1px;width:140px;margin-top:4px;background:linear-gradient(90deg,transparent,#C5A059 30%,#F4DFA8 50%,#C5A059 70%,transparent);transform:scaleX(0);animation:msv-line 1.2s cubic-bezier(.65,0,.35,1) .4s forwards}
      #msv-loader.msv-done{opacity:0;visibility:hidden;pointer-events:none}
      @keyframes msv-spin{to{transform:rotate(360deg)}}
      @keyframes msv-float{0%{transform:scale(.98);box-shadow:0 0 25px rgba(197,160,89,.25)}100%{transform:scale(1.03);box-shadow:0 0 40px rgba(197,160,89,.5)}}
      @keyframes msv-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @keyframes msv-line{to{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.msv-halo-ring{animation:none}.msv-logo-disc{animation:none}.msv-line{transform:scaleX(1)}}
    </style>
    <script>
      (function () {
        var loader = document.getElementById('msv-loader');
        if (!loader) return;
        // Customers only: the admin console and print pages open instantly
        if (location.pathname.indexOf('/admin') === 0) { loader.remove(); return; }
        // Full intro once per visit; afterwards just a brief moment
        var seen = false;
        try { seen = sessionStorage.getItem('msv_intro_seen') === '1'; sessionStorage.setItem('msv_intro_seen', '1'); } catch (e) {}
        var MIN = seen ? 300 : 2000, start = Date.now(), done = false;
        var finish = function () {
          if (done) return;
          done = true;
          loader.classList.add('msv-done');
          setTimeout(function () { loader.remove(); }, 900);
        };
        var whenReady = function () { setTimeout(finish, Math.max(0, MIN - (Date.now() - start))); };
        if (document.readyState === 'complete') whenReady();
        else window.addEventListener('load', whenReady);
        // Never block the page for long
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
